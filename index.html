<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PROJECT REAL CITY — Phase 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px);
      color: #e8e8e8; text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }
    #top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .badge {
      background: rgba(12,14,18,0.72); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 8px 14px; font-size: 13px; letter-spacing: 0.02em;
      display: flex; align-items: center; gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.ok { background: #3dd68c; box-shadow: 0 0 8px #3dd68c; }
    .dot.warn { background: #f5a623; }
    #center-msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; max-width: 88vw;
      background: rgba(8,10,14,0.88); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
      padding: 28px 32px; pointer-events: auto;
    }
    #center-msg h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #fff; }
    #center-msg p { font-size: 14px; line-height: 1.55; color: #b0b8c4; margin-bottom: 18px; }
    #connect-btn {
      display: inline-block; background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: #fff; border: none; border-radius: 10px; padding: 12px 28px;
      font-size: 15px; font-weight: 600; cursor: pointer; pointer-events: auto;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
    }
    #connect-btn:active { transform: scale(0.97); }
    #bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; opacity: 0.9; }
    #fps { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <div id="top-bar">
      <div class="badge"><span id="gp-dot" class="dot"></span><span id="gp-status">手柄未连接</span></div>
      <div class="badge" id="time-badge">12:00 · 晴</div>
    </div>
    <div id="center-msg">
      <h1>PROJECT REAL CITY</h1>
      <p>电影级照片真实感开放世界城市模拟器<br>目标设备：iPhone 14 Pro · 仅支持实体蓝牙手柄</p>
      <p style="font-size:13px;color:#8b93a3;">请连接飞智沙漠狐或其他标准 Gamepad 兼容手柄。<br>连接后点击下方按钮激活（iOS Safari 需要用户手势）。</p>
      <button id="connect-btn">检测并连接手柄</button>
    </div>
    <div id="bottom-bar">
      <div id="phase">Phase 1 · 渲染核心 + 街区 + 手柄</div>
      <div id="fps">-- fps</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
